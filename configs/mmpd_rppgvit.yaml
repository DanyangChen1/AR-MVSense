experiment:
  name: mmpd_rppgvit
  output_dir: outputs/mmpd-mini/rppgvit
  seed: 42
data:
  dataset: MMPD
  cache_path: data/cache/MMPD-mini-80
  fps: 30
  image_size: 128
  clip_length: 128
  clip_stride: 128
  label_diff: true
  frame_diff_mode: simple
  diff_alignment: extra_frame
  split_mode: numeric
  split_seed: 42
  num_workers: 0
model:
  name: rppgvit
  dim: 124
  heads: 4
  cca_depth: 3
  swta_depth: 4
  window_size: 16
  spatial_tokens: 8
  dropout: 0.3
train:
  epochs: 30
  batch_size: 4
  lr: 0.01
  weight_decay: 0.0
  device: auto
  grad_clip: 5.0
evaluation:
  low_hz: 0.75
  high_hz: 2.5
