BASE:
- ''
TOOLBOX_MODE: train_and_test
TRAIN:
  BATCH_SIZE: 4
  EPOCHS: 30
  LR: 9e-3
  MODEL_FILE_NAME: mmpd-mini_mmpd-mini_mmpd-mini_DeepPhys
  PLOT_LOSSES_AND_LR: true
  DATA:
    FS: 30
    DATASET: MMPD
    DO_PREPROCESS: true
    DATA_FORMAT: NDCHW
    DATA_PATH: ./data/raw/MMPD-mini
    CACHED_PATH: ./data/cache/rppg-toolbox/mmpd-mini/deepphys
    EXP_DATA_NAME: MMPD_DeepPhys_within_622
    BEGIN: 0.0
    END: 0.6
    PREPROCESS:
      DATA_TYPE:
      - DiffNormalized
      - Standardized
      DATA_AUG:
      - None
      LABEL_TYPE: DiffNormalized
      DO_CHUNK: true
      CHUNK_LENGTH: 180
      CROP_FACE:
        DO_CROP_FACE: true
        BACKEND: HC
        USE_LARGE_FACE_BOX: true
        LARGE_BOX_COEF: 1.5
        DETECTION:
          DO_DYNAMIC_DETECTION: false
          DYNAMIC_DETECTION_FREQUENCY: 30
          USE_MEDIAN_FACE_BOX: false
      RESIZE:
        H: 72
        W: 72
    INFO:
      LIGHT:
      - 1
      - 2
      - 3
      - 4
      MOTION:
      - 1
      - 2
      - 3
      - 4
      EXERCISE:
      - 1
      - 2
      SKIN_COLOR:
