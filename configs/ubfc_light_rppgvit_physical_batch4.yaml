experiment:
  name: ubfc_light_rppgvit_physical_batch4
  output_dir: outputs/ubfc/light_rppgvit/trials/physical_batch4
  seed: 42
data:
  dataset: UBFC-rPPG
  cache_path: data/cache/UBFC-rPPG-128
  fps: 30
  image_size: 128
  clip_length: 128
  clip_stride: 128
  label_diff: true
  frame_diff_mode: simple
  diff_alignment: extra_frame
  split_mode: numeric
  split_seed: 42
  num_workers: 0
model:
  name: light_rppgvit
  dim: 137
  tasa_depth: 4
  rep_depth: 3
  pconv_ratio: 0.25
  dropout: 0.2
train:
  epochs: 50
  batch_size: 4
  micro_batch_size: 4
  lr: 0.01
  weight_decay: 0.0
  device: auto
  grad_clip: 5.0
evaluation:
  low_hz: 0.75
  high_hz: 2.5
